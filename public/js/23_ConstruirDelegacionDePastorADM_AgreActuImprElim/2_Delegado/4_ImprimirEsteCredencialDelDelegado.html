<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		*{
			margin: 0;
			padding: 0px;
			box-sizing: border-box;
			text-decoration: none;
			font-family: sans-serif;
		}
		#portada{
			width: 323px;
			height: 454px;
			position: relative;
			margin: 0px 0px 0px 0px;
			overflow: hidden;
		}
		#imagenPortada{
			position: absolute;
			width: 100%;
			height: 100%;
		}
		span{
			position: absolute;
		}
	</style>
</head>
<body>
	<div id="portada">
		<img id="imagenPortada" src="1.png">
		<span id="spanNombreDelDelegadoID"></span><br>
		<span id="spanCedulaDelDelegadoID"></span><br><br>

		<span id="spanNombreDeLaIglesiaID"></span><br>
		<span id="spanCiudadDeLaIglesiaID"></span><br>
		<span id="spanPaisDeLaIglesiaID"></span><br><br>

		<span id="spanAsignarMesaDelegadoID"></span><br><br>

		<span id="spanHorarioDelDesayunoID"></span><br>
		<span id="spanHorarioDelAlmuerzoID"></span><br>
		<span id="spanHorarioDeLaCenaID"></span><br>	
	</div>
	

	<script>
		const capturarLosDatosEnviadosALaURL = new URLSearchParams(window.location.search)

		document.getElementById("spanNombreDelDelegadoID").textContent=capturarLosDatosEnviadosALaURL.get("NOMBRE_DELEGADO_GET")
		document.getElementById("spanCedulaDelDelegadoID").textContent=capturarLosDatosEnviadosALaURL.get("CEDULA_DELEGADO_GET")

		document.getElementById("spanNombreDeLaIglesiaID").textContent=capturarLosDatosEnviadosALaURL.get("NOMBRE_IGLESIA_GET")
		document.getElementById("spanCiudadDeLaIglesiaID").textContent=capturarLosDatosEnviadosALaURL.get("CIUDAD_IGLESIA_GET")
		document.getElementById("spanPaisDeLaIglesiaID").textContent=capturarLosDatosEnviadosALaURL.get("PAIS_IGLESIA_GET")

		document.getElementById("spanAsignarMesaDelegadoID").textContent=capturarLosDatosEnviadosALaURL.get("MESA_DELEGADO_GET")

		document.getElementById("spanHorarioDelDesayunoID").textContent=capturarLosDatosEnviadosALaURL.get("HORARIO_DESAYUNO_DEL_GET")
		document.getElementById("spanHorarioDelAlmuerzoID").textContent=capturarLosDatosEnviadosALaURL.get("HORARIO_ALMUERZO_DEL_GET")
		document.getElementById("spanHorarioDeLaCenaID").textContent=capturarLosDatosEnviadosALaURL.get("HORARIO_DE_CENA_DEL_GET")
	</script>
</body>
</html>
