<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
    <style>body{background: palegoldenrod;}</style>
</head>
<body>
    <form method="POST" action="4_SeleccionarDelegacion.php">
        <input type="text" name="nombrePOST" id="nombreID" placeholder="Nombre..." autofocus autocomplete="off"><br>
        <label id="dniLabel">0</label>
        <button type="submit">Ver Delegacion</button>
    </form>
	

	<table id="tabla" style="border: 0.2px solid darkred;">
		<thead>
            Lista de Pastores
            <tr>
                <th>DNI Pastor</th>
                <th>Nombre Completo</th>
            </tr>
        </thead>
		<tbody id="cuerpo"><!--Aqui se insertara la lista de pastores con .JSON--></tbody>
	</table>

	<script>
        function obtenerDato(fila){
            let campoID         = document.getElementById('nombreID')
            let labelDNI        = document.getElementById('dniLabel')

            labelDNI.innerHTML = fila.cells[0].innerHTML//Por que es label. fila.cells[0] = DNI (primera celda)
            campoID.value      = fila.cells[1].innerHTML//Por que es input. fila.cells[1] = Nombre (segunda celda)
        }
    </script>

    <script>
        getData()
        document.getElementById('nombreID').addEventListener('keyup', getData)
        function getData(){
            let camptext    = document.getElementById('nombreID').value
            let cuerpoTBL   = document.getElementById('cuerpo')
            let url         = '../../admin/query/3_ListaSeleccionarPastor.php'
            let formaData   = new FormData()
            formaData.append('nombrePOST', camptext)

            // ← aquí agregamos la limpieza
            if (camptext === '' || camptext === null) {
                document.getElementById('dniLabel').innerHTML = '0'
            }

            fetch(url, {
                method: 'POST',
                body: formaData
            }).then(response => response.json())
            .then(data => {
                cuerpoTBL.innerHTML = data
            })
        }
    </script>
</body>
</html>
