<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <style>
        .agregarMesaIconoID{
            position: relative;
            display: flex;
            width: 5em;
            height: 5em;
            background: #cacaca;
            text-decoration: none;
            border-radius: 0.5em;
        }
        .vagilla{
            position: absolute;
            font-size: 3.5em;
            color: black;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .agregar{
            position: absolute;
            font-size: 1.3em;
            right: 0em;
            top: 0em;
            color: white;
            background: black;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1>Delegacion</h1><br><br><br>

    <fieldset>
        <legend>Datos Pastor</legend>
        <input type="text" id="dni" readonly><br>
        <input type="text" id="nombre" readonly><br>
        <input type="text" id="categoria" readonly><br>
        <input type="text" id="extra" readonly><br>
        <input type="text" id="telefono" readonly><br>
        <input type="text" id="iglesia" readonly><br>
        <input type="text" id="ciudad" readonly><br>
        <input type="text" id="pais" readonly><br>
        <input type="text" id="mesa" readonly><br>
        <input type="text" id="anfitrion" readonly><br>
        <input type="text" id="celular" readonly><br>

        <div class="agregarMesaIconoID">
            <ion-icon name="add" class="agregar"></ion-icon>
            <ion-icon name="restaurant" class="vagilla"></ion-icon>    
        </div>
        
    </fieldset>

    <fieldset>
        <legend>Datos Delegados</legend>
        <table><!--delegados-->
            <thead align='center'>
                <tr><th>Nombre Delegado</th><th>Cedula Identidad</th><th>Mesa</th></tr>
            </thead>
            <tbody id="cuerpoDel"><!--Aqui se insertara la lista de delegados--></tbody>
        </table>
    </fieldset>

    <fieldset>
        <legend>Datos Esposa</legend>
        <input type="text" id="esposa" readonly>
    </fieldset>

    <fieldset>
        <legend>Datos Hijos</legend>
        <table><!--hijos-->
            <thead align='center'>
                <tr><th>nombre Hijo</th><th>Mesa</th></tr>
            </thead>
            <tbody id="cuerpoHijo"><!--Aqui se insertara la lista de hijos--></tbody>
        </table>
    </fieldset>

    <script>
        /*...*/
    </script>

    <script>
        document.addEventListener('DOMContentLoaded',()=>{
            const params    = new URLSearchParams(window.location.search)
            const dni_Valor = params.get('dniGetxxxxx')

            const datoDelCampoTxtClaveValor=new FormData()
            datoDelCampoTxtClaveValor.append('dniPastorEnviarPhp_POST',dni_Valor)
            
            fetch('../../admin/crud/read/4_SeleccionarDelegacion_PHP.php', {method:'POST', body:datoDelCampoTxtClaveValor})
            .then(response => response.json())
            .then(valoresDePHP => {

                // ---- Inputs ----
                document.getElementById('dni').value       = valoresDePHP.dni
                document.getElementById('nombre').value    = valoresDePHP.nombre
                document.getElementById('categoria').value = valoresDePHP.categoria
                document.getElementById('extra').value     = valoresDePHP.extra
                document.getElementById('telefono').value  = valoresDePHP.telefono
                document.getElementById('iglesia').value   = valoresDePHP.iglesia
                document.getElementById('ciudad').value    = valoresDePHP.ciudad
                document.getElementById('pais').value      = valoresDePHP.pais
                document.getElementById('mesa').value      = valoresDePHP.mesa
                document.getElementById('anfitrion').value = valoresDePHP.anfitrion
                document.getElementById('celular').value   = valoresDePHP.celular
                document.getElementById('esposa').value    = valoresDePHP.esposa

                // ---- Delegados ----
                const cuerpoDel = document.getElementById('cuerpoDel')
                let filasDelegados = ''
                valoresDePHP.delegadosArray.forEach(d => {
                    filasDelegados += `<tr>
                        <td>${d.nombre}</td>
                        <td>${d.cedula}</td>
                        <td>${d.mesa}</td>
                    </tr>`
                })
                cuerpoDel.innerHTML = filasDelegados

                // ---- Hijos ----
                const cuerpoHijo = document.getElementById('cuerpoHijo')
                let filasHijos = ''
                valoresDePHP.hijosArray.forEach(h => {
                    filasHijos += `<tr>
                        <td>${h.nombre}</td>
                        <td>${h.mesa}</td>
                    </tr>`
                })
                cuerpoHijo.innerHTML = filasHijos
            })
        })

    </script>

    <script type="module"src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
