<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <style>
        .agregarMesaIconoID{
            position: relative;
            display: flex;
            width: 5em;
            height: 5em;
            background: #cacaca;
            text-decoration: none;
            border-radius: 0.5em;
        }
        .vagilla{
            position: absolute;
            font-size: 3.5em;
            color: black;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .agregar{
            position: absolute;
            font-size: 1.3em;
            right: 0em;
            top: 0em;
            color: white;
            background: black;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1>Delegacion</h1>

    <fieldset>
        <legend>Datos Pastor</legend>
        <input type="text" id="dni" readonly><br>
        <input type="text" id="nombre" readonly><br>
        <input type="text" id="categoria" readonly><br>
        <input type="text" id="extra" readonly><br>
        <input type="text" id="telefono" readonly><br>
        <input type="text" id="iglesia" readonly><br>
        <input type="text" id="ciudad" readonly><br>
        <input type="text" id="pais" readonly><br>
        <input type="text" id="mesa" readonly><br>
        <input type="text" id="anfitrion" readonly><br>
        <input type="text" id="celular" readonly><br>

        <div class="agregarMesaIconoID">
            <ion-icon name="add" class="agregar"></ion-icon>
            <ion-icon name="restaurant" class="vagilla"></ion-icon>    
        </div>
        
    </fieldset>

    <fieldset>
        <legend>Datos Delegado</legend>
        <table><!--delegados!-->
            <thead align='center'>
                <tr><th>Nombre Delegado</th><th>Cedula Identidad</th><th>Mesa</th></tr>
            </thead>
            <tbody id="cuerpoDel"><!--Aqui se insertara la lista de delegados con .JSON--></tbody>
        </table>
    </fieldset>

    <fieldset>
        <legend>Datos Esposa</legend>
        <input type="text" id="esposa" readonly>
    </fieldset>

    <fieldset>
        <legend>Datos Hijo</legend>
        <table><!--hijos-->
            <thead align='center'>
                <tr><th>nombre Hijo</th><th>Mesa</th></tr>
            </thead>
            <tbody id="cuerpoHijo"><!--Aqui se insertara la lista de hijos con JSON--></tbody>
        </table>
    </fieldset>

    <script>
        const cargarDatos = sessionStorage.getItem('delegacionData')
        if (cargarDatos) {
            const descargarDatosAqui = JSON.parse(cargarDatos)

            document.getElementById('dni').value        = descargarDatosAqui.dni
            document.getElementById('nombre').value     = descargarDatosAqui.nombre
            document.getElementById('categoria').value  = descargarDatosAqui.categoria
            document.getElementById('extra').value      = descargarDatosAqui.extra
            document.getElementById('telefono').value   = descargarDatosAqui.telefono
            document.getElementById('iglesia').value    = descargarDatosAqui.iglesia
            document.getElementById('ciudad').value     = descargarDatosAqui.ciudad
            document.getElementById('pais').value       = descargarDatosAqui.pais
            document.getElementById('mesa').value       = descargarDatosAqui.mesa
            document.getElementById('anfitrion').value  = descargarDatosAqui.anfitrion
            document.getElementById('celular').value    = descargarDatosAqui.celular
            document.getElementById('esposa').value     = descargarDatosAqui.esposa

            const cuerpoDel = document.getElementById('cuerpoDel')
            let filasDelegados = ''
            descargarDatosAqui.delegadosArray.forEach(d => {
                filasDelegados += `<tr>
                    <td>${d.nombre}</td>
                    <td>${d.cedula}</td>
                    <td>${d.mesa}</td>
                </tr>`
            })
            cuerpoDel.innerHTML = filasDelegados

            const cuerpoHijo = document.getElementById('cuerpoHijo')
            let filasHijos = ''
            descargarDatosAqui.hijosArray.forEach(h => {
                filasHijos += `<tr>
                    <td>${h.nombre}</td>
                    <td>${h.mesa}</td>
                </tr>`
            })
            cuerpoHijo.innerHTML = filasHijos
        }
    </script>

    <script type="module"src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
