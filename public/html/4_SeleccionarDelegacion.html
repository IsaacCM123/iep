<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
</head>
<body>
    <h1>Delegacion.</h1>

    <table>
        <thead><!-- Cabeza--></thead>
        <tbody id="cuerpo"><!--Aqui se insertara la lista de pastores con .JSON--></tbody>
    </table>

    <script>
        // 1. Obtener el dniPOST de la URL
        const params = new URLSearchParams(window.location.search)
        const dni = params.get('dniPOST')

        // 2. Preparar y enviar la petición
        const formaData = new FormData()
        formaData.append('dniPOST',dni)// El dniPOST (Clave) viajara hasta 5_xxx.php llevando el contenido (Valor) del dni

        fetch('../../admin/query/5_xxx.php', {
            method: 'POST',
            body: formaData
        })
        .then(response=>response.json())
        .then(data=>{
            document.getElementById('cuerpo').innerHTML = data
        })
    </script>

</body>
</html>
