<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
</head>
<body>
    <h1>Delegacion...</h1>

    <input type="text" id="dni" readonly>
    <input type="text" id="nombre" readonly>
    <input type="text" id="categoria" readonly>
    <input type="text" id="extra" readonly>
    <input type="text" id="telefono" readonly>
    <input type="text" id="idMesa" readonly>

    <script>
        const cargarDatos = sessionStorage.getItem('delegacionData');
        if (cargarDatos) {
            const descargarDatosAqui = JSON.parse(cargarDatos)

            document.getElementById('dni').value       = descargarDatosAqui.dni;
            document.getElementById('nombre').value    = descargarDatosAqui.nombre;
            document.getElementById('categoria').value = descargarDatosAqui.categoria;
            document.getElementById('extra').value     = descargarDatosAqui.extra;
            document.getElementById('telefono').value  = descargarDatosAqui.telefono;
            document.getElementById('idMesa').value    = descargarDatosAqui.idMesa;
        }
    </script>

</body>
</html>
