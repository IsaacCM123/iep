<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
</head>
<body>
    <h1>Delegacion...</h1>

    <input type="text" id="dni" readonly>
    <input type="text" id="nombre" readonly>
    <input type="text" id="categoria" readonly>
    <input type="text" id="iglesia" readonly>
    <input type="text" id="ciudad" readonly>
    <input type="text" id="esposa" readonly>
    <input type="text" id="anfitrion" readonly>
    <input type="text" id="mesa" readonly>

    <script>
        const cargarDatos = sessionStorage.getItem('delegacionData');
        if (cargarDatos) {
            const descargarDatosAqui = JSON.parse(cargarDatos)

            document.getElementById('dni').value        = descargarDatosAqui.dni;
            document.getElementById('nombre').value     = descargarDatosAqui.nombre;
            document.getElementById('categoria').value  = descargarDatosAqui.categoria;
            document.getElementById('iglesia').value    = descargarDatosAqui.iglesia;
            document.getElementById('ciudad').value     = descargarDatosAqui.ciudad;
            document.getElementById('esposa').value     = descargarDatosAqui.esposa;
            document.getElementById('anfitrion').value  = descargarDatosAqui.anfitrion;
            document.getElementById('mesa').value       = descargarDatosAqui.mesa;
        }
    </script>

</body>
</html>
