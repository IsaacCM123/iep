<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<h3>Plataforma Pastor</h3>
	<input type="text" name="N" id="nombreID" placeholder="Nombre...">
	<label id="dniLabel">0</label>

	<table id="tabla">
		<thead>Lista de Pastores</thead>
		<tbody id="cuerpo"><!--Aqui se insertara la lista de pastores con .JSON--></tbody>
	</table>

	<script>
        function obtenerDato(fila){
            let campoID         = document.getElementById('nombreID')
            let labelDNI        = document.getElementById('dniLabel')

            labelDNI.innerHTML = fila.cells[0].innerHTML//Por que es label. fila.cells[0] = DNI (primera celda)
            campoID.value      = fila.cells[1].innerHTML//Por que es input. fila.cells[1] = Nombre (segunda celda)
        }
    </script>

    <script>
        getData()
        document.getElementById('nombreID').addEventListener('keyup', getData)
        function getData(){
            let camptext    = document.getElementById('nombreID').value
            let cuerpoTBL   = document.getElementById('cuerpo')
            let url         = '3_lista.php'
            let formaData   = new FormData()
            formaData.append('N', camptext)
            fetch(url, {
                method: 'POST',
                body: formaData
            }).then(response => response.json())
            .then(data => {
                cuerpoTBL.innerHTML = data
            })
        }
    </script>
</body>
</html>
