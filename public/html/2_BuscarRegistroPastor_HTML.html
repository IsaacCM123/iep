<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
    
    <input type="text" name="nombrePOST" id="buscarMinistroID" placeholder="Nombre Ministro..." autofocus autocomplete="off"><br><br>
    
    <dialog id="modalDialogRegistroPastorID" closedby='any'>
        <h3>Registro Ministro.</h3>
        <form method="GET" action="5_SeleccionarDelegacion_HTML.html">
            <input type="text" id="dniPastorID" name="dniGetxxxxx" placeholder="0" readonly><br>
            <input type="text" id="nombreMinistroID" readonly><br>
            <input type="text" id="categoriaMinistroID" readonly><br>
            <input type="text" id="telefonoMinistroID" readonly><br>
            <p>¿Deseas Dirigirte a Delegacion?.<br>(Grupo de Representantes de una Iglesia.)</p>
            <input type="button" id="cancelarID" value="cancelar">
            <button type="submit">Delegacion</button>
        </form>    
    </dialog>
    


















	<table>
		<thead align='center'>
            <tr><th>D.n.i.</th><th>Nombre Ministro</th><th>Categoria</th><th>Telefono</th></tr>
        </thead>
		<tbody id="cuerpo"><!--Aqui se insertara la lista de pastores con .JSON--></tbody>
	</table>

	<script>
        function obtenerValoresDeLaFilaClickeada(fila){
            document.getElementById('dniPastorID').value        =fila.cells[0].innerHTML
            document.getElementById('buscarMinistroID').value   =fila.cells[1].innerHTML
            document.getElementById('nombreMinistroID').value   =fila.cells[1].innerHTML
            document.getElementById('categoriaMinistroID').value   =fila.cells[2].innerHTML
            document.getElementById('telefonoMinistroID').value   =fila.cells[3].innerHTML
            modalDialogRegistroPastorID.showModal()
        }
    </script>

    <script>
        document.getElementById('cancelarID').addEventListener('click',()=>{
            modalDialogRegistroPastorID.close()
            document.querySelector("#buscarMinistroID").focus();
        })
    </script>

    <script>
        getData()
        document.getElementById('buscarMinistroID').addEventListener('keyup', getData)
        function getData(){
            let camptext    = document.getElementById('buscarMinistroID').value
            let cuerpoTBL   = document.getElementById('cuerpo')
            let url         = '../../admin/crud/read/3_BuscarRegistroPastor_PHP.php'
            let formaData   = new FormData()
            formaData.append('nombrePOSTEnviarPHP', camptext)

            // aquí agregamos la limpieza
            if (camptext === '' || camptext === null) {
                document.getElementById('dniPastorID').value = '0'
            }

            fetch(url, {
                method: 'POST',
                body: formaData
            }).then(response => response.json())
            .then(data => {
                cuerpoTBL.innerHTML = data
            })
        }
    </script>
</body>
</html>
