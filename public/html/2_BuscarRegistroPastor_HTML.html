<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
    <form id="formBuscar">
        <input type="text" name="nombrePOST" id="nombreID" placeholder="Nombre..." autofocus autocomplete="off"><br><br>
        <input type="text" name="dniPOST" id="dniID" placeholder="0" readonly><br><br>
        <button type="submit">Ver Delegacion</button>
    </form>

	<table>
		<thead align='center'>
            <tr><th>DNI Pastor</th><th>Nombre Completo</th></tr>
        </thead>
		<tbody id="cuerpo"><!--Aqui se insertara la lista de pastores con .JSON--></tbody>
	</table>

	<script>//Hacemos click en una fila para seleccionar el dniPastor y nombreCompleto de pastror
        function obtenerDato(fila){
            let campoID         = document.getElementById('nombreID')
            let campoDNI        = document.getElementById('dniID')

            campoDNI.value      = fila.cells[0].innerHTML//Por que es label. fila.cells[0] = DNI (primera celda)
            campoID.value       = fila.cells[1].innerHTML//Por que es input. fila.cells[1] = Nombre (segunda celda)
        }
    </script>

    <script>// Cargamos los registros de todos los pastores en la tabla

        let temporizador
        let controladorActual

        getData()// Para RAILWAY........
        document.getElementById('nombreID').addEventListener('keyup', function(){// Para RAILWAY........
            clearTimeout(temporizador)// Para RAILWAY........
            temporizador = setTimeout(getData, 300)//Espera 300ms desde la ultima tecla
        })// Para RAILWAY........

        function getData(){
            let camptext    = document.getElementById('nombreID').value
            let cuerpoTBL   = document.getElementById('cuerpo')
            let url         = '../../admin/query/3_BuscarRegistroPastor_PHP.php'
            let formaData   = new FormData()
            formaData.append('nombrePOST', camptext)

            // ← aquí agregamos la limpieza
            if (camptext === '' || camptext === null) {
                document.getElementById('dniID').value = '0'
            }

            // Si había una petición anterior en curso, la cancelamos
            if (controladorActual) {//Para RAILWAY...
                controladorActual.abort()//Para RAILWAY...
            }//Para RAILWAY...
            controladorActual = new AbortController()//Para RAILWAY...

            fetch(url, {
                method: 'POST',
                body: formaData,
                signal: controladorActual.signal//Para  RAILWAY.........
            }).then(response => response.json())
            .then(data => {
                cuerpoTBL.innerHTML = data
            })
            .catch(err=>{//Para RAILWAY........
                if (err.name !== 'AbortError') {console.error(err)}//Para RAILWAY........
            })//Para RAILWAY........
        }
    </script>

    <script>//Seleccionamos los datos de Hijo, Esposa, Delegado, Iglesia, Pastor, para asignarles: Hospedaje, Mesa por su dniPastor.
        document.getElementById('formBuscar').addEventListener('submit', function(e){
        e.preventDefault()

        const dni = document.getElementById('dniID').value
        const nombre = document.getElementById('nombreID').value

        const formaData = new FormData()
        formaData.append('dniPOSTParaPHP', dni)
        formaData.append('nombrePOSTParaPHP', nombre)

        fetch('../../admin/query/4_SeleccionarDelegacion_PHP.php', {
            method: 'POST',
            body: formaData
            })
            .then(response => response.json())
            .then(data => {
            sessionStorage.setItem('delegacionData', JSON.stringify(data))
            window.location.href = '5_SeleccionarDelegacion_HTML.html'
            })
        })
    </script>
</body>
</html>
