    <script>
        conseguirDatos()
        document.getElementById('nombreID').addEventListener('keyup',conseguirDatos)
        function conseguirDatos(){
            const datoFormateado = new FormData()
            datoFormateado.append('ClaveNombrePost_QueryPHP',document.getElementById('nombreID').value)

            // aquí agregamos la limpieza
            if (document.getElementById('nombreID').value === '' || document.getElementById('nombreID').value === null) {
                document.getElementById('dniPastorID').value = '0'
            }

            fetch('../../admin/crud/read/7_GestionarListaPastor_PHP.php',{method:'POST',body:datoFormateado})
            .then(response=>response.json())
            .then(valoresDePHP=>{
                document.getElementById('cuerpoTBL').innerHTML = valoresDePHP
            })    
        }
        
    </script>

    <script>
        document.getElementById('cuerpoTBL').addEventListener('click', function(e) {
            // Verifica que el click haya sido en el ícono o en la celda "actualizar"
            const celdaActualizar = e.target.closest('.editarRegistro')
            if (!celdaActualizar) return // si el click fue en otra parte de la fila, no hace nada

            const fila = celdaActualizar.closest('tr') // obtiene la fila completa

            document.getElementById('campoDni').value       = fila.cells[0].innerHTML
            document.getElementById('campoNombre').value     = fila.cells[1].innerHTML
            document.getElementById('campoCategoria').value  = fila.cells[2].innerHTML
            document.getElementById('campoExtra').value      = fila.cells[3].innerHTML
            document.getElementById('campoTelefono').value   = fila.cells[4].innerHTML
            document.getElementById('campoMesa').value       = fila.cells[5].innerHTML

            modalDialog.showModal()
        })
    </script>

    <!--Eliminar registro con confirmacion ........................INICIO-->
    <script>
            // Variable donde guardamos temporalmente la URL de eliminación,
            // mientras esperamos que el usuario confirme o rechace la acción.
            let urlEliminarPendiente = null

            // Delegación de eventos: escuchamos los clicks en el contenedor de la tabla (cuerpoTBL),
            // porque las filas (y los links de eliminar) se generan dinámicamente después del fetch,
            // y por lo tanto no existen todavía al momento de cargar la página.
            document.getElementById('cuerpoTBL').addEventListener('click', function(e) {

                // Buscamos si el elemento donde se hizo click (o alguno de sus padres cercanos)
                // tiene la clase 'eliminarRegistro'. Esto detecta el click sin importar si cayó
                // exactamente en el <a> o en el <ion-icon> que está dentro de él.
                const enlaceEliminar = e.target.closest('.eliminarRegistro')

                // Si el click NO fue en el ícono/link de eliminar, no hacemos nada
                // (evita que el modal se abra al hacer click en otra parte de la fila).
                if (!enlaceEliminar) return

                // Evitamos que el navegador siga el href inmediatamente.
                // Sin esto, la eliminación se ejecutaría al instante, sin dar tiempo a confirmar.
                e.preventDefault()

                // Guardamos la URL real de eliminación (con el DNI ya incluido en el query string)
                // para poder usarla después, solo si el usuario confirma.
                urlEliminarPendiente = enlaceEliminar.href

                // Mostramos el modal de confirmación.
                modalConfirmarEliminar.showModal()
            })

            // Botón "Continuar": el usuario decidió seguir adelante con la eliminación.
            document.getElementById('btnContinuarEliminacion').addEventListener('click', function() {

                // Verificamos que exista una URL pendiente (por seguridad, evita ejecutar algo vacío).
                if (urlEliminarPendiente) {

                    // Recién aquí navegamos a la URL real, lo que dispara la petición GET
                    // hacia 9_EliminarPastor.php y ejecuta el DELETE en la base de datos.
                    window.location.href = urlEliminarPendiente
                }
            })

            // Botón "Rechazar": el usuario decidió cancelar la acción.
            document.getElementById('btnRechazarEliminacion').addEventListener('click', function() {

                // Limpiamos la variable para no dejar una URL "colgada" que se pueda
                // ejecutar por error en otro momento.
                urlEliminarPendiente = null

                // Cerramos el modal sin haber navegado a ningún lado.
                modalConfirmarEliminar.close()
            })
    </script>
