<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title></title>
	</head>
	<body>

		<button command="show-modal" commandfor="dialogModalUsuario">Usuario</button>
        <dialog id="dialogModalUsuario" closedby="any">
        	<h3>Login Usuario</h3>
	        <form method="POST" action="login_Infinix.php">
				<input type="text" 		placeholder="Usuario" 		 name="nomUsrPOST" autofocus><br>
				<input type="password" 	placeholder="Contraseña" 	 name="pasUsrPOST"><br>
				<input type="button" 	id="cerrarModalUsuario" value="Cancelar">
				<input type="submit" 	value="INGRESAR">
			</form>    
        </dialog>

        <button command="show-modal" commandfor="dialogModalAdministrador">Administrador</button>
        <dialog id="dialogModalAdministrador" closedby="any">
        	<h3>Login Administrador</h3>
	        <form method="POST" action="login_Infinix.php">
				<input type="text" 		placeholder="Administrador"	name="nomAdmPOST" autofocus><br>
				<input type="password" 	placeholder="Contraseña" 	name="pasAdmPOST"><br>
				<input type="button" 	id="cerrarModalAdministrador" value="Cancelar">
				<input type="submit" 	value="INGRESAR">
			</form>    
        </dialog>

        <script>
        	document.getElementById('cerrarModalUsuario').addEventListener('click',()=>{
        	document.getElementById('dialogModalUsuario').close()})

        	document.getElementById('cerrarModalAdministrador').addEventListener('click',()=>{
        	document.getElementById('dialogModalAdministrador').close()})
        </script>

	</body>
</html>
