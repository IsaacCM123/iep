		<h3>Aplicacion Web De Gesion Corporativa</h3>

		<button command="show-modal" commandfor="dialogModalOperario">Operario</button>
        <dialog id="dialogModalOperario" closedby="any">
        	<h3>Login Operario</h3>
	        <form method="POST" action="admin/core/20_lock.php">
				<input type="text" 		placeholder="Operario" 		name="nomOprPOST" autofocus><br>
				<input type="password" 	placeholder="Contraseña" 	name="pasOprPOST"><br>
				<input type="button" 	id="cerrarModalOperario" 	value="Cancelar">
				<input type="submit" 	value="INGRESAR">
			</form>    
        </dialog>

        <button command="show-modal" commandfor="dialogModalAdministrador">Administrador</button>
        <dialog id="dialogModalAdministrador" closedby="any">
        	<h3>Login Administrador</h3>
	        <form method="POST" action="admin/core/20_lock.php">
				<input type="text" 		placeholder="Administrador"	name="nomAdmPOST" autofocus><br>
				<input type="password" 	placeholder="Contraseña" 	name="pasAdmPOST"><br>
				<input type="button" 	id="cerrarModalAdministrador" value="Cancelar">
				<input type="submit" 	value="INGRESAR">
			</form>    
        </dialog>
