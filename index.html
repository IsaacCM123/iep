<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title></title>
	</head>
	<body>
		<h3>Aplicación Web De Gestión Corporativa</h3>

		<button command="show-modal" commandfor="dialogModalOperario">Operario</button>
        <dialog id="dialogModalOperario" closedby="any">
        	<h3>Login Operario</h3>
	        <form method="POST" action="admin/core/20_lock.php">
				<input type="text" 		placeholder="Operario" 		name="nomOprPOST" autocomplete="off" autofocus><br>
				<input type="password" 	placeholder="Contraseña" 	name="pasOprPOST"><br>
				<input type="button" 	id="cerrarModalOperario" 	value="Cancelar">
				<input type="submit" 	value="INGRESAR">
			</form>    
        </dialog>

        <button command="show-modal" commandfor="dialogModalAdministrador">Administrador</button>
        <dialog id="dialogModalAdministrador" closedby="any">
        	<h3>Login Administrador</h3>
	        <form method="POST" action="admin/core/20_lock.php">
				<input type="text" 		placeholder="Administrador"	name="nomAdmPOST" autocomplete="off" autofocus><br>
				<input type="password" 	placeholder="Contraseña" 	name="pasAdmPOST"><br>
				<input type="button" 	id="cerrarModalAdministrador" value="Cancelar">
				<input type="submit" 	value="INGRESAR">
			</form>    
        </dialog>        

        <script>
        	document.getElementById('cerrarModalOperario').addEventListener('click',()=>{
        	document.getElementById('dialogModalOperario').close()})

        	document.getElementById('cerrarModalAdministrador').addEventListener('click',()=>{
        	document.getElementById('dialogModalAdministrador').close()})
        </script>

	</body>
</html>
